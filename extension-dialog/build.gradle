plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdk = 37

    defaultConfig {
        minSdkVersion 14

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    namespace 'm.co.rh.id.anavigator.extension.dialog'
}

dependencies {

    implementation project(path: ':navigator')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.github.rh-id'
                artifactId = 'a-navigator-extension-dialog'
                version = '0.0.1'
            }
        }
    }
}

// JitPack injects an extra Maven publication per module under Gradle 9+
// (named after the project). If it keeps different coordinates from the
// release publication, generating the POM/module-metadata of dependent
// modules hard-fails with "multiple publications that have different
// coordinates". Align every non-release publication to the release
// coordinates; container rules run after create-time configuration, so
// this wins regardless of when JitPack injects it.
publishing.publications.matching { it.name != 'release' }.all {
    groupId = 'com.github.rh-id'
    artifactId = 'a-navigator-extension-dialog'
    version = '0.0.1'
}