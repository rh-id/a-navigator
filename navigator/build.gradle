plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdk = 37

    defaultConfig {
        minSdkVersion 14

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        // NOTE: JitPack's tag builds have no jitpack.yml and rely on
        // auto-detecting the JDK from these VERSION_17 strings ("Using
        // JDK 17 (build.gradle)" in the v0.0.74 log). If these are ever
        // refactored away, pin the JDK again or tags will build on the
        // wrong JDK and fail AGP's Java-version check.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    namespace 'm.co.rh.id.anavigator'
}

dependencies {
    implementation 'androidx.transition:transition:1.4.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.github.rh-id'
                artifactId = 'a-navigator'
                version = '0.0.1'
                pom {
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    organization {
                        name = 'Ruby Hartono'
                        url = 'https://github.com/rh-id'
                    }
                }
            }
        }
    }
}