plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    // 34 (not 37): AGP 8.2.0's SDK loader only reads package.xml schema v3 and
    // cannot load the versioned android-37.0 platform (schema v4, new dir
    // naming), so compileSdk 37 hard-fails with "Failed to find Platform SDK".
    // 34 is AGP 8.2's max tested compileSdk; revisit after an AGP upgrade.
    compileSdk 34

    defaultConfig {
        minSdkVersion 14

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    namespace 'm.co.rh.id.anavigator'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            // Creates a Maven publication called "release".
            release(MavenPublication) {
                // Applies the component for the release build variant.
                from components.release

                // You can then customize attributes of the publication as shown below.
                groupId = 'com.github.rh-id'
                artifactId = 'a-navigator'
                version = '0.0.1'
                pom {
                    licenses {
                        license {
                            name = 'MIT License'
                            url = 'https://opensource.org/licenses/MIT'
                        }
                    }
                    organization {
                        name = 'Ruby Hartono'
                        url = 'https://github.com/rh-id'
                    }
                }
            }
        }
    }
}